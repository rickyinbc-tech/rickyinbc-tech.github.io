name: Website availability and SSL monitoring

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy static site"]
    types: [completed]

permissions:
  contents: read
  pages: read

concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check live pages, failover status, origin configuration, and certificate expiry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-site-health.mjs
